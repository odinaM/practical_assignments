<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Практическая работа: Drag and Drop</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../forms/form.css">
    <link rel="stylesheet" href="../drag_and_drop/drag_and_drop.css">
    <link rel="stylesheet" href="../uml/uml.css">
</head>

<body>

    <!-- шапка -->
    <header class="header">
        <div class="logo">MIDIS <span>IT</span></div>
        <nav class="nav">
            <a href="../index.html" class="nav-link">Главная</a>
        </nav>
    </header>

    <div class="container">
        <!-- кнопка назад -->
        <a href="../index.html" class="btn_back">← Назад к списку</a>

        <!-- макет из двух колонок -->
        <div class="work-layout">

            <!-- левая колонка -->
            <div class="student-work-container">
                <h2 class="work-title">Разработка ИС Абитуриенты</h2>
                <p class="text_work"> ERD - Диограмма</p>

                <div class="student-work">
                    <!-- erd diograma -->

                     <div class="uml-card">
                        <img src="../img/Untitled.png" alt="ERD">
                    </div>
                     
                </div>
            </div>

            <!-- правая колонка -->
            <div class="work-info">
                <h2 class="work-title">Оценка преподавателя</h2>
                <p class="work-info-text">Поставьте оценку от 1 до 5 и оставьте комментарий.</p>

                <div class="grading-panel">
                    <h4 class="grading-title">Ваша оценка:</h4>
                    <div class="stars" id="star-rating">
                        <span class="star" data-value="1">★</span>
                        <span class="star" data-value="2">★</span>
                        <span class="star" data-value="3">★</span>
                        <span class="star" data-value="4">★</span>
                        <span class="star" data-value="5">★</span>
                    </div>

                    <h4 class="grading-title">Комментарий:</h4>
                    <textarea id="comment-box" class="comment-box" placeholder="Напишите отзыв о работе..."></textarea>

                    <button class="btn btn-save" onclick="saveGrade()">Сохранить оценку</button>
                </div>
            </div>

        </div>
    </div>

    <!-- скрипты -->
    <script src="../grade.js"></script>
    <script src="../script.js"></script>
    <script src="./drag_and_drop.js"></script>
</body>

</html>
