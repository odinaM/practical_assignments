<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../forms/form.css">
    <link rel="stylesheet" href="./no_violations.css">
    <title>Нарушениям.Нет - Вход</title>
</head>

<body>
    <main>
        <div class="r_container">
            <div class="r_card">
                <div class="r_title">
                    <div class="blue_logo logo">НАРУШЕНИЙ</div>
                    <div class="red_logo logo">.НЕТ </div>
                </div>
                <div class="auto_r">
                    <p>Авторизация</p>
                </div>

                <form id="loginForm" action="statements.html">
                    <div class="input">
                        <div class="form-group">
                            <input type="text" name="username" placeholder="Логин *" required>
                            <div class="error-message">Введите логин.</div>
                        </div>
                        <div class="form-group">
                            <input type="password" name="password" placeholder="Пароль *" required>
                            <div class="error-message">Введите пароль.</div>
                        </div>
                    </div>
                    <button type="submit" class="button_r" style="margin-top: 40px;">Войти</button>
                </form>

                <div class="r_rtrt">
                    <p><a href="registration.html" class="a">Зарегистрироваться</a></p>
                </div>
            </div>
        </div>
    </main>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function (e) {
            const inputs = this.querySelectorAll('input[required]');
            let valid = true;

            inputs.forEach(input => {
                if (input.value.trim() === '') {
                    input.classList.add('invalid');
                    input.nextElementSibling.style.display = 'block';
                    valid = false;
                } else {
                    input.classList.remove('invalid');
                    input.nextElementSibling.style.display = 'none';
                }
            });

            if (!valid) e.preventDefault();
        });
    </script>
</body>

</html>
